<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swarithmetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <section id="console-panel" class="panel">
    <div class="panel-header">
      <span id="title" class="pixel-label">SWARITHMETIC</span>
      <span id="subtitle" class="mono-label">sing to solve</span>
    </div>

    <div class="operand-row">
      <div class="field">
        <input id="num1" type="number" placeholder="4" inputmode="numeric" />
        <span class="mono-label">operand 1</span>
      </div>

      <div class="field">
        <button id="op-btn" class="op-btn" aria-label="Cycle operator">+</button>
        <span class="mono-label">operator</span>
      </div>

      <div class="field">
        <input id="num2" type="number" placeholder="6" inputmode="numeric" />
        <span class="mono-label">operand 2</span>
      </div>
    </div>

    <button id="calculate-btn" class="calculate-btn">CALCULATE ▶</button>
    <p id="error-msg" class="error-msg" hidden></p>
  </section>

  <section id="game-panel" class="panel game-panel" hidden>
    <span id="level-label" class="pixel-label small">LEVEL 1 / 3</span>

    <div class="meter-track">
      <div id="target-line" class="target-line"></div>
      <div id="meter-fill" class="meter-fill"></div>
    </div>
    <p class="mono-label meter-caption">pitch meter</p>

    <div id="stage" class="stage"></div>

    <p id="equation" class="equation"></p>
    <p id="answer" class="answer"></p>
    <button id="reset-btn" class="reset-btn" hidden>sing again ↗</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
